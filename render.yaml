# One-click deploy on Render: New → Blueprint → point at this repo.
services:
  - type: web
    name: stormline
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: HTTP_USER_AGENT
        value: "stormline-truck-routing/1.0"
